services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    volumes: ["shop_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/server.js"
volumes:
  shop_pg:
